<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
	<title>BrickVerse Desktop Settings</title>
	<style>
		:root{color-scheme:dark;font-family:Inter,Segoe UI,sans-serif;background:#17191d;color:#e7e9ed}*{box-sizing:border-box}body{margin:0;padding:28px;background:linear-gradient(180deg,#1d2025,#17191d)}h1{font-size:22px;margin:0 0 6px}p{color:#9aa3af;margin:0 0 24px;line-height:1.45}.card{background:#22262c;border:1px solid #353b44;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.12)}.card h2{margin:0 0 12px;font-size:12px;color:#8fa1b6;text-transform:uppercase;letter-spacing:.07em}.row{display:flex;gap:11px;align-items:flex-start;margin:13px 0}.row input{margin-top:3px;accent-color:#0d6efd}.row label{font-weight:600}.row small{display:block;color:#949eaa;font-weight:400;margin-top:3px;line-height:1.4}.fields{display:grid;gap:9px;margin-top:14px}input[type=text]{background:#15181d;color:#fff;border:1px solid #414955;border-radius:7px;padding:10px;outline:0}input[type=text]:focus{border-color:#0d6efd;box-shadow:0 0 0 3px rgba(13,110,253,.14)}button{border:0;border-radius:7px;background:#0d6efd;color:#fff;padding:10px 16px;font-weight:700;cursor:pointer}button:hover{background:#247cf0}#status{margin-left:10px;color:#a8b1bd;font-size:13px}
	</style>
</head>
<body>
	<h1>Desktop settings</h1>
	<p>These settings affect this installed client. Account visibility remains available in BrickVerse privacy settings.</p>
	<section class="card">
		<h2>App behavior</h2>
		<div class="row"><input type="checkbox" id="launchAtLogin"><label for="launchAtLogin">Launch when I sign in<small>Start Guild Channels automatically with your computer.</small></label></div>
		<div class="row"><input type="checkbox" id="closeToTray"><label for="closeToTray">Keep running in the tray<small>Closing the window keeps calls, notifications, and unread badges available.</small></label></div>
	</section>
	<section class="card">
		<h2>Activity and presence</h2>
		<div class="row"><input type="checkbox" id="enabled"><label for="enabled">Share rich presence<small>Publish enabled activity sources to BrickVerse.</small></label></div>
		<div class="row"><input type="checkbox" id="games"><label for="games">Detect games<small>Detect supported launchers locally and resolve cover artwork.</small></label></div>
		<div class="row"><input type="checkbox" id="music"><label for="music">Detect Spotify<small>Use local playback window metadata and resolve album artwork.</small></label></div>
		<div class="row"><input type="checkbox" id="discord"><label for="discord">Discord Rich Presence<small>Mirror Guild Channels activity to Discord.</small></label></div>
	</section>
	<section class="card">
		<h2>Custom activity</h2>
		<div class="row"><input type="checkbox" id="custom"><label for="custom">Use custom activity<small>Custom activity takes priority over automatic detection.</small></label></div>
		<div class="fields"><input type="text" id="name" maxlength="100" placeholder="Application name"><input type="text" id="details" maxlength="128" placeholder="Details"><input type="text" id="state" maxlength="128" placeholder="State"></div>
	</section>
	<button id="save" type="button">Save settings</button><span id="status" role="status"></span>
	<script src="../dist/settings-renderer.js"></script>
</body>
</html>
