name: Release Guild Chat

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    environment: release
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
      AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
      AZURE_ARTIFACT_SIGNING_PROFILE_NAME: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE_NAME }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build unpacked application
        run: npx electron-builder --win --x64 --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Log in to Azure for trusted signing
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' && env.AZURE_ARTIFACT_SIGNING_ENDPOINT != '' && env.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME != '' && env.AZURE_ARTIFACT_SIGNING_PROFILE_NAME != ''
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Guild Chat executable
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' && env.AZURE_ARTIFACT_SIGNING_ENDPOINT != '' && env.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME != '' && env.AZURE_ARTIFACT_SIGNING_PROFILE_NAME != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_ARTIFACT_SIGNING_PROFILE_NAME }}
          files: release/win-unpacked/BrickVerseGuildChannels.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: BrickVerse Guild Chat
          description-url: https://brickverse.gg
      - name: Verify signature
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != '' && env.AZURE_ARTIFACT_SIGNING_ENDPOINT != '' && env.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME != '' && env.AZURE_ARTIFACT_SIGNING_PROFILE_NAME != ''
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -FilePath "release/win-unpacked/BrickVerseGuildChannels.exe"
          if ($signature.Status -ne "Valid") { throw "Invalid application signature: $($signature.Status)" }
      - name: Report unsigned build
        if: env.AZURE_CLIENT_ID == '' || env.AZURE_TENANT_ID == '' || env.AZURE_SUBSCRIPTION_ID == '' || env.AZURE_ARTIFACT_SIGNING_ENDPOINT == '' || env.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME == '' || env.AZURE_ARTIFACT_SIGNING_PROFILE_NAME == ''
        shell: pwsh
        run: Write-Warning "Azure trusted-signing secrets are incomplete; packaging an unsigned Windows build."
      - name: Package installer and update metadata
        shell: pwsh
        run: npx electron-builder --win nsis --x64 --prepackaged "release/win-unpacked" --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: guild-chat-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  build-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npm run dist:mac
            artifact: guild-chat-macos
          - os: ubuntu-latest
            command: npm run dist:linux
            artifact: guild-chat-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify update artifacts
        shell: bash
        run: |
          find release -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' \) | grep -q .
          find release -maxdepth 1 -type f -name '*.yml' | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.blockmap
            release/*.yml
          if-no-files-found: error

  publish:
    needs: [build-windows, build-unix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          mapfile -d '' files < <(find release-assets -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.blockmap' -o -name '*.yml' \) -print0)
          (( ${#files[@]} > 0 )) || exit 1
          gh release upload "$tag" "${files[@]}" --clobber
